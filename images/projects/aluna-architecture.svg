<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="aluna-title aluna-description">
  <title id="aluna-title">ALUNA IoT system architecture</title>
  <desc id="aluna-description">Architecture illustration. Sensors send data through MQTT to a Next.js API. A dashboard requests data through REST. The API also exposes a separate server-sent events endpoint; this illustration does not show a dashboard subscription. The backend connects to MongoDB for telemetry and reports, and to PostgreSQL through Prisma.</desc>
